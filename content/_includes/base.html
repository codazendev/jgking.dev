<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <title>{{ title }}{% if title !== "Jeremy King" %} | Jeremy King{% endif %}</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description" content="Website of Jeremy King">
        <link rel="favicon" href="">
        <link rel="stylesheet" href="/assets/css/base.css">
    </head>
    <body>
        <nav>
            <div class="inner">
                <a class="logo" href="/">
                    Jeremy
                    <span>King</span>
                </a>
                <div class="links">
                    <a {% if page.url == "/projects/"%}class="active"{% endif %}href="/projects/">Projects</a>
                    <a {% if page.url == "/links/"%}class="active"{% endif %}href="/links/">Links</a>
                    <a {% if page.url == "/todo/"%}class="active"{% endif %}href="/todo/">Todo</a>
                    <a {% if page.url == "/sitemap/"%}class="active"{% endif %}href="/sitemap/">Sitemap</a>
                </div>
            </div>
        </nav>
        
        <div class="page">
            {{ content | safe }}
            <footer class="box">
                <h1>Footer</h1>
                TBD
            </footer>
        </div>

    </body>
</html>
